name: naporta

# Valores vêm do arquivo passado em --env-file (ex.: .env.development).
# - `npm run db:up`     sobe só o PostgreSQL (API local com start:dev);
# - `npm run docker:up` sobe PostgreSQL, aplica migrations e sobe a API
#   (serviços do profile "app").

x-app-environment: &app-environment
  # Dentro da rede do Compose o banco é o host "db", porta 5432.
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no arquivo de ambiente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo de ambiente}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no arquivo de ambiente}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations versionadas (prisma migrate deploy) e termina.
  # Também executa o seed: `npm run docker:seed`.
  migrate:
    profiles: [app]
    build:
      context: .
      target: migrator
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      <<: *app-environment
      NODE_ENV: production
      PORT: 3333
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo de ambiente}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-5h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - '${API_PORT:-3333}:3333'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
