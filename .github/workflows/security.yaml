name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secretlint:
    name: Secretlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci
        env:
          HUSKY: 0

      - name: Procurar segredos nos arquivos
        run: npm run lint:secrets

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Usa apenas o package-lock.json; não precisa instalar dependências.
      - name: Vulnerabilidades (ferramentas da raiz)
        run: npm audit --audit-level=high

      - name: Vulnerabilidades (backend)
        working-directory: backend
        run: npm audit --audit-level=high
