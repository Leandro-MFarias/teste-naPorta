name: naporta

# Valores vêm do arquivo passado em --env-file (ex.: .env.development).
# - `npm run db:up`     sobe o PostgreSQL e o Mailpit (API local com start:dev);
# - `npm run docker:up` sobe também as migrations, a API e o frontend
#   (serviços do profile "app").

x-app-environment: &app-environment
  # Dentro da rede do Compose o banco é o host "db", porta 5432.
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no arquivo de ambiente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo de ambiente}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no arquivo de ambiente}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP de desenvolvimento: captura os emails enviados pela API
  # (nada sai para a internet). Interface web: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations versionadas (prisma migrate deploy) e termina.
  # Também executa o seed: `npm run docker:seed`.
  migrate:
    profiles: [app]
    build:
      context: .
      target: migrator
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      <<: *app-environment
      NODE_ENV: production
      PORT: 3333
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo de ambiente}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-5h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_FROM: ${MAIL_FROM:-naPorta <no-reply@naporta.local>}
      # Mailpit do Compose. Para um SMTP real, ajuste estas variáveis.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
    ports:
      - '${API_PORT:-3333}:3333'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  # Frontend Next.js (../frontend). Fala com a API pela rede do Compose;
  # o navegador só acessa o frontend.
  web:
    profiles: [app]
    build:
      context: ../frontend
      target: runtime
    restart: unless-stopped
    environment:
      API_URL: http://api:3333
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
